<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">To-Do List</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>To-Do List</h1>
        <form th:action="@{/add}" method="post" class="mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="form-label">제목</label>
                    <input type="text" name="title" class="form-control" placeholder="할 일 제목" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">설명</label>
                    <input type="text" name="description" class="form-control" placeholder="설명">
                </div>
                <div class="col-md-1">
                    <label class="form-label">우선순위 <i class="fas fa-exclamation-circle"></i></label>
                    <select name="priority" class="form-select">
                        <option value="HIGH">높음</option>
                        <option value="MEDIUM" selected>중간</option>
                        <option value="LOW">낮음</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">색상</label>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" id="colorDropdownButton" data-bs-toggle="dropdown">색상 선택</button>
                        <div class="dropdown-menu">
                            <input type="radio" name="color" value="" id="color-none" checked class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #dee2e6;" onclick="selectColor(this, 'color-none', '없음')"></span> 없음</div>
                            <input type="radio" name="color" value="red" id="color-red" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #dc3545;" onclick="selectColor(this, 'color-red', '빨간색')"></span> 빨간색</div>
                            <input type="radio" name="color" value="blue" id="color-blue" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #0d6efd;" onclick="selectColor(this, 'color-blue', '파란색')"></span> 파란색</div>
                            <input type="radio" name="color" value="green" id="color-green" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #198754;" onclick="selectColor(this, 'color-green', '초록색')"></span> 초록색</div>
                            <input type="radio" name="color" value="yellow" id="color-yellow" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #ffc107;" onclick="selectColor(this, 'color-yellow', '노란색')"></span> 노란색</div>
                            <input type="radio" name="color" value="purple" id="color-purple" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #6f42c1;" onclick="selectColor(this, 'color-purple', '보라색')"></span> 보라색</div>
                            <input type="radio" name="color" value="orange" id="color-orange" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #fd7e14;" onclick="selectColor(this, 'color-orange', '주황색')"></span> 주황색</div>
                            <input type="radio" name="color" value="pink" id="color-pink" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #d63384;" onclick="selectColor(this, 'color-pink', '분홍색')"></span> 분홍색</div>
                            <input type="radio" name="color" value="teal" id="color-teal" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #20c997;" onclick="selectColor(this, 'color-teal', '청록색')"></span> 청록색</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label">아이콘</label>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" id="iconDropdownButton" data-bs-toggle="dropdown">아이콘 선택</button>
                        <div class="dropdown-menu">
                            <input type="radio" name="icon" value="" id="icon-none" checked class="d-none">
                            <div class="dropdown-item"><span class="icon-option" onclick="selectIcon(this, 'icon-none', '없음')"><i class="fas fa-ban"></i></span> 없음</div>
                            <input type="radio" name="icon" value="fa-star" id="icon-star" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" onclick="selectIcon(this, 'icon-star', '별')"><i class="fas fa-star"></i></span> 별</div>
                            <input type="radio" name="icon" value="fa-circle" id="icon-circle" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" onclick="selectIcon(this, 'icon-circle', '원')"><i class="fas fa-circle"></i></span> 원</div>
                            <input type="radio" name="icon" value="fa-square" id="icon-square" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" onclick="selectIcon(this, 'icon-square', '사각형')"><i class="fas fa-square"></i></span> 사각형</div>
                            <input type="radio" name="icon" value="fa-heart" id="icon-heart" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" onclick="selectIcon(this, 'icon-heart', '하트')"><i class="fas fa-heart"></i></span> 하트</div>
                            <input type="radio" name="icon" value="fa-bell" id="icon-bell" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" onclick="selectIcon(this, 'icon-bell', '종')"><i class="fas fa-bell"></i></span> 종</div>
                            <input type="radio" name="icon" value="fa-flag" id="icon-flag" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" onclick="selectIcon(this, 'icon-flag', '깃발')"><i class="fas fa-flag"></i></span> 깃발</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100">추가</button>
                </div>
            </div>
        </form>

        <div th:each="priority : ${priorities}" class="mb-4">
            <h3 th:text="${priority == 'HIGH' ? '높음' : priority == 'MEDIUM' ? '중간' : '낮음'}" class="text-capitalize"></h3>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center todo-item"
                    th:classappend="${todo.getColor()}"
                    th:each="todo : ${todos}"
                    th:if="${todo.getPriority() == priority}">
                    <div>
                        <form th:action="@{/pin/{id}(id=${todo.getId()})}" method="post" class="d-inline me-2">
                            <button type="submit" class="btn btn-link p-0" title="Pin">
                                <i class="fas fa-thumbtack" th:classappend="${todo.isPinned()} ? 'text-warning' : 'text-muted'"></i>
                            </button>
                        </form>
                        <form th:action="@{/toggle/{id}(id=${todo.getId()})}" method="post" class="d-inline me-2">
                            <input type="checkbox" th:checked="${todo.isCompleted()}" onclick="this.form.submit()" class="form-check-input">
                        </form>
                        <i th:if="${todo.getIcon()}" th:class="'fas ' + ${todo.getIcon()} + ' me-2'"></i>
                        <span th:text="${todo.getTitle()}" th:style="${todo.isCompleted()} ? 'text-decoration: line-through' : ''"></span>
                        <small class="text-muted ms-2" th:text="${todo.getDescription()}"></small>
                    </div>
                    <div>
                        <a th:href="@{/edit/{id}(id=${todo.getId()})}" class="btn btn-warning btn-sm me-2">Edit</a>
                        <form th:action="@{/delete/{id}(id=${todo.getId()})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
