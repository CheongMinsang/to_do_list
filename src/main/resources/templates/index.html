<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">To-Do List</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>To-Do List</h1>
        <form th:action="@{/add}" method="post" class="mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-3">
                    <input type="text" name="title" class="form-control" placeholder="할 일 제목" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="description" class="form-control" placeholder="설명">
                </div>
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-exclamation-circle"></i></span>
                        <select name="priority" class="form-select">
                            <option value="HIGH">높음</option>
                            <option value="MEDIUM" selected>중간</option>
                            <option value="LOW">낮음</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">추가</button>
                </div>
            </div>
        </form>

        <!-- 우선순위별 분류 -->
        <div th:each="priority : ${priorities}" class="mb-4">
            <h3 th:text="${priority == 'HIGH' ? '높음' : priority == 'MEDIUM' ? '중간' : '낮음'}" class="text-capitalize"></h3>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    th:each="todo : ${todos}"
                    th:if="${todo.getPriority() == priority}">
                    <div>
                        <form th:action="@{/pin/{id}(id=${todo.getId()})}" method="post" class="d-inline me-2">
                            <button type="submit" class="btn btn-link p-0" title="Pin">
                                <i class="fas fa-thumbtack" th:classappend="${todo.isPinned()} ? 'text-warning' : 'text-muted'"></i>
                            </button>
                        </form>
                        <form th:action="@{/toggle/{id}(id=${todo.getId()})}" method="post" class="d-inline">
                            <input type="checkbox" th:checked="${todo.isCompleted()}" onclick="this.form.submit()">
                        </form>
                        <span th:text="${todo.getTitle()}" th:style="${todo.isCompleted()} ? 'text-decoration: line-through' : ''"></span>
                        <small class="text-muted" th:text="${todo.getDescription()}"></small>
                    </div>
                    <div>
                        <a th:href="@{/edit/{id}(id=${todo.getId()})}" class="btn btn-warning btn-sm me-2">Edit</a>
                        <form th:action="@{/delete/{id}(id=${todo.getId()})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
