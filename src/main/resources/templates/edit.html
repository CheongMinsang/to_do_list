<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit To-Do</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Edit To-Do</h1>
        <form th:action="@{/edit/{id}(id=${todo.getId()})}" th:object="${todo}" method="post" class="mb-3">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" name="title" th:value="${todo.getTitle()}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" id="description" name="description" th:value="${todo.getDescription()}" class="form-control">
            </div>
            <div class="mb-3">
                <label for="priority" class="form-label">Priority <i class="fas fa-exclamation-circle"></i></label>
                <select id="priority" name="priority" class="form-select">
                    <option value="HIGH" th:selected="${todo.getPriority() == 'HIGH'}">높음</option>
                    <option value="MEDIUM" th:selected="${todo.getPriority() == 'MEDIUM'}">중간</option>
                    <option value="LOW" th:selected="${todo.getPriority() == 'LOW'}">낮음</option>
                </select>
            </div>
            <div class="mb-3 row">
                <div class="col-md-6">
                    <label class="form-label">Color</label>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" id="colorDropdownButton" data-bs-toggle="dropdown" 
                                th:text="${todo.getColor() == null ? '색상 선택' : todo.getColor() == 'red' ? '빨간색' : todo.getColor() == 'blue' ? '파란색' : todo.getColor() == 'green' ? '초록색' : todo.getColor() == 'yellow' ? '노란색' : todo.getColor() == 'purple' ? '보라색' : todo.getColor() == 'orange' ? '주황색' : todo.getColor() == 'pink' ? '분홍색' : '청록색'}">색상 선택</button>
                        <div class="dropdown-menu">
                            <input type="radio" name="color" value="" id="color-none" th:checked="${todo.getColor() == null}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #dee2e6;" th:classappend="${todo.getColor() == null ? 'selected' : ''}" onclick="selectColor(this, 'color-none', '없음')"></span> 없음</div>
                            <input type="radio" name="color" value="red" id="color-red" th:checked="${todo.getColor() == 'red'}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #dc3545;" th:classappend="${todo.getColor() == 'red' ? 'selected' : ''}" onclick="selectColor(this, 'color-red', '빨간색')"></span> 빨간색</div>
                            <input type="radio" name="color" value="blue" id="color-blue" th:checked="${todo.getColor() == 'blue'}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #0d6efd;" th:classappend="${todo.getColor() == 'blue' ? 'selected' : ''}" onclick="selectColor(this, 'color-blue', '파란색')"></span> 파란색</div>
                            <input type="radio" name="color" value="green" id="color-green" th:checked="${todo.getColor() == 'green'}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #198754;" th:classappend="${todo.getColor() == 'green' ? 'selected' : ''}" onclick="selectColor(this, 'color-green', '초록색')"></span> 초록색</div>
                            <input type="radio" name="color" value="yellow" id="color-yellow" th:checked="${todo.getColor() == 'yellow'}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #ffc107;" th:classappend="${todo.getColor() == 'yellow' ? 'selected' : ''}" onclick="selectColor(this, 'color-yellow', '노란색')"></span> 노란색</div>
                            <input type="radio" name="color" value="purple" id="color-purple" th:checked="${todo.getColor() == 'purple'}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #6f42c1;" th:classappend="${todo.getColor() == 'purple' ? 'selected' : ''}" onclick="selectColor(this, 'color-purple', '보라색')"></span> 보라색</div>
                            <input type="radio" name="color" value="orange" id="color-orange" th:checked="${todo.getColor() == 'orange'}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #fd7e14;" th:classappend="${todo.getColor() == 'orange' ? 'selected' : ''}" onclick="selectColor(this, 'color-orange', '주황색')"></span> 주황색</div>
                            <input type="radio" name="color" value="pink" id="color-pink" th:checked="${todo.getColor() == 'pink'}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #d63384;" th:classappend="${todo.getColor() == 'pink' ? 'selected' : ''}" onclick="selectColor(this, 'color-pink', '분홍색')"></span> 분홍색</div>
                            <input type="radio" name="color" value="teal" id="color-teal" th:checked="${todo.getColor() == 'teal'}" class="d-none">
                            <div class="dropdown-item"><span class="color-option" style="background-color: #20c997;" th:classappend="${todo.getColor() == 'teal' ? 'selected' : ''}" onclick="selectColor(this, 'color-teal', '청록색')"></span> 청록색</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Icon</label>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" id="iconDropdownButton" data-bs-toggle="dropdown" 
                                th:text="${todo.getIcon() == null ? '아이콘 선택' : todo.getIcon() == 'fa-star' ? '별' : todo.getIcon() == 'fa-circle' ? '원' : todo.getIcon() == 'fa-square' ? '사각형' : todo.getIcon() == 'fa-heart' ? '하트' : todo.getIcon() == 'fa-bell' ? '종' : '깃발'}">아이콘 선택</button>
                        <div class="dropdown-menu">
                            <input type="radio" name="icon" value="" id="icon-none" th:checked="${todo.getIcon() == null}" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" th:classappend="${todo.getIcon() == null ? 'selected' : ''}" onclick="selectIcon(this, 'icon-none', '없음')"><i class="fas fa-ban"></i></span> 없음</div>
                            <input type="radio" name="icon" value="fa-star" id="icon-star" th:checked="${todo.getIcon() == 'fa-star'}" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" th:classappend="${todo.getIcon() == 'fa-star' ? 'selected' : ''}" onclick="selectIcon(this, 'icon-star', '별')"><i class="fas fa-star"></i></span> 별</div>
                            <input type="radio" name="icon" value="fa-circle" id="icon-circle" th:checked="${todo.getIcon() == 'fa-circle'}" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" th:classappend="${todo.getIcon() == 'fa-circle' ? 'selected' : ''}" onclick="selectIcon(this, 'icon-circle', '원')"><i class="fas fa-circle"></i></span> 원</div>
                            <input type="radio" name="icon" value="fa-square" id="icon-square" th:checked="${todo.getIcon() == 'fa-square'}" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" th:classappend="${todo.getIcon() == 'fa-square' ? 'selected' : ''}" onclick="selectIcon(this, 'icon-square', '사각형')"><i class="fas fa-square"></i></span> 사각형</div>
                            <input type="radio" name="icon" value="fa-heart" id="icon-heart" th:checked="${todo.getIcon() == 'fa-heart'}" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" th:classappend="${todo.getIcon() == 'fa-heart' ? 'selected' : ''}" onclick="selectIcon(this, 'icon-heart', '하트')"><i class="fas fa-heart"></i></span> 하트</div>
                            <input type="radio" name="icon" value="fa-bell" id="icon-bell" th:checked="${todo.getIcon() == 'fa-bell'}" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" th:classappend="${todo.getIcon() == 'fa-bell' ? 'selected' : ''}" onclick="selectIcon(this, 'icon-bell', '종')"><i class="fas fa-bell"></i></span> 종</div>
                            <input type="radio" name="icon" value="fa-flag" id="icon-flag" th:checked="${todo.getIcon() == 'fa-flag'}" class="d-none">
                            <div class="dropdown-item"><span class="icon-option" th:classappend="${todo.getIcon() == 'fa-flag' ? 'selected' : ''}" onclick="selectIcon(this, 'icon-flag', '깃발')"><i class="fas fa-flag"></i></span> 깃발</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" id="completed" name="completed" th:checked="${todo.isCompleted()}" class="form-check-input">
                <label for="completed" class="form-check-label">Completed</label>
            </div>
            <button type="submit" class="btn btn-success">Save</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
