<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit To-Do</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Edit To-Do</h1>
        <form th:action="@{/edit/{id}(id=${todo.getId()})}" th:object="${todo}" method="post" class="mb-3">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" name="title" th:value="${todo.getTitle()}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" id="description" name="description" th:value="${todo.getDescription()}" class="form-control">
            </div>
            <div class="mb-3">
                <label for="priority" class="form-label">Priority <i class="fas fa-exclamation-circle"></i></label>
                <select id="priority" name="priority" class="form-select">
                    <option value="HIGH" th:selected="${todo.getPriority() == 'HIGH'}">높음</option>
                    <option value="MEDIUM" th:selected="${todo.getPriority() == 'MEDIUM'}">중간</option>
                    <option value="LOW" th:selected="${todo.getPriority() == 'LOW'}">낮음</option>
                </select>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" id="completed" name="completed" th:checked="${todo.isCompleted()}" class="form-check-input">
                <label for="completed" class="form-check-label">Completed</label>
            </div>
            <button type="submit" class="btn btn-success">Save</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
